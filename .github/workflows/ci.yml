name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typkontroll, lint och tester
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blindprovat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Engångsdatabas i CI-containern, ingen hemlighet.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/blindprovat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typkontroll
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Enhetstester
        run: npm test

      - name: Migrationer
        run: npm run db:migrate

      - name: Databastester
        run: npm run test:db

      # Engångsnyckel som bara gäller i det här jobbet, ingen hemlighet.
      - name: Sessionsnyckel för e2e
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Installera webbläsare för e2e
        run: npx playwright install --with-deps chromium

      - name: E2E-tester
        run: npm run test:e2e
